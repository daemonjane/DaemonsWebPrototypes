<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="./dist/output.css" rel="stylesheet"><title>TechStore | Checkout</title></head>
<body class="bg-slate-950 text-slate-200">
    <header class="bg-slate-900 border-b border-slate-800 p-4"><div class="max-w-4xl mx-auto"><a href="index.html" class="text-cyan-400 font-bold text-xl">← Back to Store</a></div></header>
    <main class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6">Checkout</h1>
        <div class="grid md:grid-cols-2 gap-8">
            <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
                <h2 class="text-xl font-semibold mb-4">Order Summary</h2>
                <ul id="checkout-items" class="space-y-2"></ul>
                <div class="border-t border-slate-700 mt-4 pt-4 text-right"><span class="text-lg">Total: </span><span id="checkout-total" class="text-2xl font-bold text-cyan-400"></span></div>
                <button id="place-order-btn" class="mt-6 w-full bg-cyan-600 py-3 rounded-md font-bold">Place Order (Demo)</button>
            </div>
            <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
                <h2 class="text-xl font-semibold mb-4">Shipping Info</h2>
                <form id="checkout-form"><input type="text" placeholder="Full Name" class="w-full bg-slate-800 border border-slate-700 rounded p-2 mb-3"><input type="email" placeholder="Email" class="w-full bg-slate-800 border border-slate-700 rounded p-2 mb-3"><input type="text" placeholder="Address" class="w-full bg-slate-800 border border-slate-700 rounded p-2 mb-3"><button type="submit" class="hidden">Place</button></form>
            </div>
        </div>
    </main>
    <script>
        function getCart(){return JSON.parse(localStorage.getItem('techstore_cart')||'[]');}
        function renderCheckout(){let cart=getCart();let ul=document.getElementById('checkout-items');ul.innerHTML='';let total=0;cart.forEach(item=>{total+=item.price;let li=document.createElement('li');li.className='flex justify-between';li.innerHTML=`<span>${item.name}</span><span>$${item.price.toFixed(2)}</span>`;ul.appendChild(li);});document.getElementById('checkout-total').textContent=`$${total.toFixed(2)}`;}
        document.getElementById('place-order-btn').onclick=()=>{alert('Demo order placed! Cart will be cleared.');localStorage.removeItem('techstore_cart');window.location.href='index.html';};
        renderCheckout();
    </script>
</body>
</html>
