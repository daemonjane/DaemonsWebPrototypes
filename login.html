<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="./dist/output.css" rel="stylesheet"><title>TechStore | Login</title></head>
<body class="bg-slate-950 text-slate-200 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 p-8 rounded-2xl border border-slate-700 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">Sign In</h1>
        <form id="login-form">
            <input type="email" id="login-email" placeholder="Email" class="w-full bg-slate-800 border border-slate-700 rounded p-3 mb-4" required>
            <input type="password" id="login-password" placeholder="Password" class="w-full bg-slate-800 border border-slate-700 rounded p-3 mb-4" required>
            <button type="submit" class="w-full bg-cyan-600 py-3 rounded-md font-semibold">Login</button>
        </form>
        <p class="text-center text-sm mt-4">Don't have an account? <a href="register.html" class="text-cyan-400">Register</a></p>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit',(e)=>{e.preventDefault();localStorage.setItem('techstore_user',JSON.stringify({email:document.getElementById('login-email').value}));window.location.href='index.html';});
    </script>
</body>
</html>
