<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="./dist/output.css" rel="stylesheet"><title>TechStore | Register</title></head>
<body class="bg-slate-950 text-slate-200 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 p-8 rounded-2xl border border-slate-700 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">Create Account</h1>
        <form id="register-form">
            <input type="text" placeholder="Full Name" class="w-full bg-slate-800 border border-slate-700 rounded p-3 mb-4">
            <input type="email" id="reg-email" placeholder="Email" class="w-full bg-slate-800 border border-slate-700 rounded p-3 mb-4" required>
            <input type="password" id="reg-password" placeholder="Password" class="w-full bg-slate-800 border border-slate-700 rounded p-3 mb-4" required>
            <button type="submit" class="w-full bg-cyan-600 py-3 rounded-md font-semibold">Register</button>
        </form>
        <p class="text-center text-sm mt-4">Already have an account? <a href="login.html" class="text-cyan-400">Login</a></p>
    </div>
    <script>document.getElementById('register-form').addEventListener('submit',(e)=>{e.preventDefault();localStorage.setItem('techstore_user',JSON.stringify({email:document.getElementById('reg-email').value}));window.location.href='index.html';});</script>
</body>
</html>
