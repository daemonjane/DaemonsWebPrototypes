<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./dist/output.css" rel="stylesheet">
    <title>TechStore | Shop</title>
</head>
<body class="bg-slate-950 text-slate-200 antialiased relative">

    <!-- ========== COPY HEADER FROM INDEX.HTML (exactly) ========== -->
    <header id="main-header" class="sticky top-0 z-50 w-full border-b border-slate-800 bg-slate-950/75 backdrop-blur-md">
        <div class="grid grid-cols-1 lg:grid-cols-3 items-center gap-4 px-4 sm:px-6 py-4 max-w-7xl mx-auto">
            <div class="flex items-center justify-between">
                <a href="index.html" id="brand-logo" class="text-cyan-400 font-bold text-xl sm:text-2xl tracking-widest select-none">TECHSTORE</a>
                <button id="mobile-menu-toggle" class="lg:hidden text-slate-400 hover:text-cyan-400 focus:outline-none rounded p-1">...</button>
            </div>
            <div id="header-search" class="flex items-center justify-start lg:justify-center gap-2 w-full">
                <input type="text" id="catalog-search" placeholder="Search products..." class="w-full max-w-md mx-auto lg:max-w-xs bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-cyan-400">
            </div>
            <nav id="main-nav" class="hidden lg:flex flex-wrap lg:justify-end gap-5 text-sm font-medium w-full">
                <a href="index.html" class="text-slate-400 hover:text-cyan-400">Home</a>
                <a href="index.html#features" class="text-slate-400 hover:text-cyan-400">Features</a>
                <a href="index.html#products" class="text-slate-400 hover:text-cyan-400">Hardware</a>
                <a href="index.html#bundles" class="text-slate-400 hover:text-cyan-400">Bundles</a>
                <a href="index.html#micro-upgrades" class="text-slate-400 hover:text-cyan-400">Optimize</a>
                <a href="index.html#insights-preview" class="text-slate-400 hover:text-cyan-400">Insights</a>
                <a href="shop.html" class="text-cyan-400">Shop</a>
                <button id="cart-trigger" class="text-cyan-400 font-semibold relative pr-2">Cart <span id="cart-count-badge" class="absolute -top-1 -right-2 bg-cyan-500 text-black text-[10px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span></button>
                <a href="login.html" id="auth-link" class="text-slate-400 hover:text-cyan-400">Login</a>
            </nav>
        </div>
        <div id="cart-dropdown" class="hidden absolute right-0 top-full mt-1 w-80 bg-slate-900 border border-slate-700 rounded-lg shadow-2xl p-4 z-50 space-y-3">
            <h3 class="text-sm font-semibold text-slate-300 uppercase">Your Cart</h3>
            <ul id="cart-items-list" class="space-y-2 max-h-48 overflow-y-auto text-sm"></ul>
            <div class="flex items-center justify-between border-t border-slate-700 pt-2"><span class="text-slate-400 text-xs">Total:</span><span id="cart-total-display" class="text-cyan-400 font-bold text-lg">$0.00</span></div>
            <button id="checkout-btn" class="w-full bg-cyan-600 text-white py-2 rounded-md text-sm font-semibold hover:bg-cyan-500">Checkout</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-white mb-2">All Hardware</h1>
        <p class="text-slate-400 mb-8">High‑performance components, pre‑built systems, and peripherals.</p>

        <!-- Filters and Sort -->
        <div class="flex flex-wrap gap-4 mb-8 items-center justify-between">
            <div class="flex gap-2">
                <button data-filter="all" class="filter-btn active bg-cyan-600 text-white px-4 py-1 rounded-full text-sm">All</button>
                <button data-filter="desktop" class="filter-btn bg-slate-800 hover:bg-cyan-700 px-4 py-1 rounded-full text-sm">Desktops</button>
                <button data-filter="monitors" class="filter-btn bg-slate-800 hover:bg-cyan-700 px-4 py-1 rounded-full text-sm">Monitors</button>
                <button data-filter="peripherals" class="filter-btn bg-slate-800 hover:bg-cyan-700 px-4 py-1 rounded-full text-sm">Peripherals</button>
            </div>
            <select id="sort-select" class="bg-slate-800 border border-slate-700 rounded px-3 py-1 text-sm">
                <option value="default">Sort by</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name-asc">Name: A-Z</option>
            </select>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-6 mt-16 text-center text-slate-500 text-sm">
        <div class="max-w-7xl mx-auto px-4">&copy; 2026 TechStore. Global Supply Hub.</div>
    </footer>

    <script>
        // ---------- PRODUCT DATABASE ----------
        const products = [
            { id: "vanguard-desktop", name: "Vanguard Series i7 / RTX 5070", price: 2499, category: "desktop", description: "Liquid‑cooled extreme desktop.", image: "assets/vanguard-desktop-fallback.png", specs: { gpu: "12GB Next‑Gen", cpu: "Intel i7‑14th", cooling: "360mm AIO" } },
            { id: "ultrawide-monitor", name: "34\" QD-OLED Ultrawide", price: 899, category: "monitors", description: "240Hz, 0.03ms, HDR.", image: "assets/ultrawide-monitor-fallback.png", specs: { panel: "QD‑OLED", refresh: "240Hz", response: "0.03ms" } },
            { id: "cyberpro-keyboard", name: "Cyber-Pro Mechanical Keyboard", price: 129, category: "peripherals", description: "Hot‑swappable brown switches.", image: "assets/cyberpro-keyboard-fallback.png", specs: { switches: "Tactile Brown", frame: "Aluminum" } },
            { id: "gaming-mouse", name: "Precision Gaming Mouse", price: 79.99, category: "peripherals", description: "16K DPI, 6 buttons.", image: "assets/gamingmouse.jpg", specs: { dpi: "16000", buttons: "6" } },
            { id: "wireless-headset", name: "Wireless ANC Headset", price: 149.99, category: "peripherals", description: "Low-latency, 40h battery.", image: "assets/headset.jpg", specs: { battery: "40h" } },
            { id: "usb-hub", name: "Powered USB-C Hub (7‑Port)", price: 59.99, category: "peripherals", description: "10Gbps, 60W PD.", image: "assets/USBhub.jpg", specs: { ports: "7xUSB3" } }
        ];

        // Cart helpers (same as index.html)
        function getCart() { return JSON.parse(localStorage.getItem('techstore_cart') || '[]'); }
        function saveCart(c) { localStorage.setItem('techstore_cart', JSON.stringify(c)); updateCartUI(); }
        function addToCart(product) { const c = getCart(); c.push(product); saveCart(c); }
        function updateCartUI() {
            const cart = getCart();
            const badge = document.getElementById('cart-count-badge');
            const list = document.getElementById('cart-items-list');
            const totalSpan = document.getElementById('cart-total-display');
            if(badge) badge.textContent = cart.length;
            if(list) {
                list.innerHTML = '';
                let total = 0;
                cart.forEach((item, idx) => {
                    total += item.price;
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center bg-slate-800 rounded p-2 text-sm';
                    li.innerHTML = `<span>${item.name}</span><div><span>$${item.price.toFixed(2)}</span><button data-remove="${idx}" class="ml-2 text-red-400">&times;</button></div>`;
                    list.appendChild(li);
                });
                if(totalSpan) totalSpan.textContent = `$${total.toFixed(2)}`;
                document.querySelectorAll('[data-remove]').forEach(btn => {
                    btn.addEventListener('click', () => { let c = getCart(); c.splice(parseInt(btn.dataset.remove),1); saveCart(c); });
                });
            }
        }

        let currentFilter = 'all';
        let currentSort = 'default';

        function renderProducts() {
            let filtered = products.filter(p => currentFilter === 'all' || p.category === currentFilter);
            if (currentSort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
            else if (currentSort === 'price-desc') filtered.sort((a,b) => b.price - a.price);
            else if (currentSort === 'name-asc') filtered.sort((a,b) => a.name.localeCompare(b.name));
            const container = document.getElementById('products-grid');
            if (!container) return;
            container.innerHTML = filtered.map(p => `
                <div class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 flex flex-col group hover:border-cyan-500 transition-all duration-300 hover:-translate-y-1">
                    <div class="h-48 w-full bg-slate-800 overflow-hidden">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                    </div>
                    <div class="p-5 flex flex-col flex-1 space-y-3">
                        <h3 class="text-lg font-bold text-white">${p.name}</h3>
                        <p class="text-slate-400 text-sm">${p.description}</p>
                        <div class="mt-auto flex items-center justify-between pt-4 border-t border-slate-800">
                            <span class="text-xl font-bold text-white">$${p.price.toFixed(2)}</span>
                            <button data-id="${p.id}" data-name="${p.name.replace(/"/g, '&quot;')}" data-price="${p.price}" class="add-to-cart-btn bg-cyan-600 text-white px-4 py-2 rounded-md text-sm font-semibold hover:bg-cyan-500 active:scale-95">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    addToCart({ id: btn.dataset.id, name: btn.dataset.name, price: parseFloat(btn.dataset.price) });
                    btn.textContent = 'Added!';
                    setTimeout(() => btn.textContent = 'Add to Cart', 800);
                });
            });
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'bg-cyan-600', 'text-white'));
                btn.classList.add('active', 'bg-cyan-600', 'text-white');
                btn.classList.remove('bg-slate-800');
                currentFilter = btn.dataset.filter;
                renderProducts();
            });
        });
        document.getElementById('sort-select')?.addEventListener('change', (e) => { currentSort = e.target.value; renderProducts(); });

        // cart dropdown toggle
        const cartTrigger = document.getElementById('cart-trigger');
        const cartDropdown = document.getElementById('cart-dropdown');
        if(cartTrigger) {
            cartTrigger.addEventListener('click', (e) => { e.stopPropagation(); cartDropdown.classList.toggle('hidden'); });
            document.addEventListener('click', (e) => { if(!cartTrigger.contains(e.target) && !cartDropdown.contains(e.target)) cartDropdown.classList.add('hidden'); });
        }
        document.getElementById('checkout-btn')?.addEventListener('click', () => window.location.href = 'checkout.html');
        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
