<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./dist/output.css" rel="stylesheet">
    <title>TechStore | Shop</title>
    <style>
        /* Custom styles for expandable cards */
        .product-card .extra-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.2s ease;
        }
        .product-card:hover .extra-content {
            max-height: 200px;  /* enough to show specs + quantity + buttons */
            opacity: 1;
            transition: max-height 0.4s ease-in, opacity 0.3s ease 0.1s;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
        }
        /* Star rating */
        .star-rating {
            display: inline-flex;
            gap: 2px;
        }
        .toast {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased selection:bg-cyan-500 selection:text-black relative">

    <!-- ========== HEADER FROM INDEX.HTML (COPY EXACTLY) ========== -->
    <!-- 
        Paste your full <header> block here. It must include:
        - #main-header with all its children
        - #cart-trigger, #cart-count-badge, #cart-dropdown, #cart-items-list, #cart-total-display, #checkout-btn
        - #mobile-menu-toggle, #main-nav
    -->
   <header id="main-header" class="sticky top-0 z-50 w-full border-b border-slate-800 bg-slate-950/75 backdrop-blur-md">
        <div class="grid grid-cols-1 lg:grid-cols-3 items-center gap-4 px-4 sm:px-6 py-4 max-w-7xl mx-auto">
            <div class="flex items-center justify-between">
                <a href="index.html" id="brand-logo" class="text-cyan-400 font-bold text-xl sm:text-2xl tracking-widest select-none">TECHSTORE</a>
                <button id="mobile-menu-toggle" class="lg:hidden text-slate-400 hover:text-cyan-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 rounded p-1" aria-label="Open menu" aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>

            <div id="header-search" class="flex items-center justify-start lg:justify-center gap-2 w-full">
                <label for="catalog-search" class="text-sm text-slate-400 hidden sm:inline shrink-0">Find Gear:</label>
                <input type="text" id="catalog-search" list="hardware-suggestions" placeholder="Search components..."
                       class="w-full max-w-md mx-auto lg:max-w-xs bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 focus-visible:border-cyan-400 transition-colors">
                <datalist id="hardware-suggestions">
                    <option value="Vanguard Prebuilt Rig">
                    <option value="RTX 5070 Graphics Card">
                    <option value="Cyber-Pro Keyboard">
                    <option value="QD-OLED Ultrawide Panel">
                    <option value="Thermal Matrix Compound">
                </datalist>
            </div>

            <nav id="main-nav" class="hidden lg:flex flex-wrap lg:justify-end gap-5 text-sm font-medium w-full">
                <a href="index.html" class="text-slate-400 hover:text-cyan-400 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 rounded">Home</a>
                <a href="index.html#features" class="text-slate-400 hover:text-cyan-400 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 rounded">Features</a>
                <a href="index.html#products" class="text-slate-400 hover:text-cyan-400 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 rounded">Hardware</a>
                <a href="index.html#bundles" class="text-slate-400 hover:text-cyan-400 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 rounded">Bundles</a>
                <a href="index.html#micro-upgrades" class="text-slate-400 hover:text-cyan-400 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 rounded">Optimize</a>
                <a href="index.html#insights-preview" class="text-slate-400 hover:text-cyan-400 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 rounded">Insights</a>
                <a href="shop.html" class="text-slate-400 hover:text-cyan-400 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 rounded">Shop</a>
                <!-- Cart trigger -->
                <button id="cart-trigger" class="text-cyan-400 font-semibold relative pr-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 rounded" aria-label="Shopping Cart, 0 items" aria-expanded="false">
                    Cart
                    <span id="cart-count-badge" aria-hidden="true" class="absolute -top-1 -right-2 bg-cyan-500 text-black text-[10px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
                </button>
                <a href="login.html" id="auth-link" class="text-slate-400 hover:text-cyan-400 transition-colors">Login</a>
            </nav>
        </div>

        <!-- Cart dropdown panel -->
        <div id="cart-dropdown" class="hidden absolute right-0 top-full mt-1 w-80 bg-slate-900 border border-slate-700 rounded-lg shadow-2xl p-4 z-50 space-y-3">
            <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Your Cart</h3>
            <ul id="cart-items-list" class="space-y-2 max-h-48 overflow-y-auto text-sm"></ul>
            <div class="flex items-center justify-between border-t border-slate-700 pt-2">
                <span class="text-slate-400 text-xs">Total:</span>
                <span id="cart-total-display" class="text-cyan-400 font-bold text-lg">$0.00</span>
            </div>
            <button id="checkout-btn" class="w-full bg-cyan-600 text-white py-2 rounded-md text-sm font-semibold hover:bg-cyan-500 transition-colors">Checkout</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-white mb-2">All Hardware</h1>
        <p class="text-slate-400 mb-6">High‑performance components, pre‑built systems, and peripherals.</p>

        <!-- Filter, search, sort bar -->
        <div class="flex flex-wrap gap-4 mb-8 items-center justify-between">
            <div class="flex gap-2 flex-wrap">
                <button data-filter="all" class="filter-btn active bg-cyan-600 text-white px-4 py-1 rounded-full text-sm">All</button>
                <button data-filter="desktop" class="filter-btn bg-slate-800 hover:bg-cyan-700 px-4 py-1 rounded-full text-sm">Desktops</button>
                <button data-filter="monitors" class="filter-btn bg-slate-800 hover:bg-cyan-700 px-4 py-1 rounded-full text-sm">Monitors</button>
                <button data-filter="peripherals" class="filter-btn bg-slate-800 hover:bg-cyan-700 px-4 py-1 rounded-full text-sm">Peripherals</button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="search-input" placeholder="Search by name..." class="bg-slate-800 border border-slate-700 rounded-md px-3 py-1 text-sm focus:ring-2 focus:ring-cyan-400">
                <select id="sort-select" class="bg-slate-800 border border-slate-700 rounded px-3 py-1 text-sm">
                    <option value="default">Sort by</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="name-asc">Name: A-Z</option>
                </select>
            </div>
        </div>

        <!-- Products grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Toast container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

    <footer class="bg-slate-900 border-t border-slate-800 py-6 mt-16 text-center text-slate-500 text-sm">
        <div class="max-w-7xl mx-auto px-4">&copy; 2026 TechStore. Global Supply Hub.</div>
    </footer>

    <script>
        // ---------- PRODUCT DATABASE (extended with specs) ----------
        const products = [
            { id: "vanguard-desktop", name: "Vanguard Series i7 / RTX 5070", price: 2499, category: "desktop", description: "Liquid‑cooled extreme desktop. Ultimate performance.", image: "assets/vanguard-desktop-fallback.png", rating: 4.8, specs: ["RTX 5070 12GB", "Intel i7-14th 20‑Core", "32GB DDR5", "360mm AIO"] },
            { id: "ultrawide-monitor", name: "34\" QD-OLED Ultrawide", price: 899, category: "monitors", description: "240Hz, 0.03ms, infinite contrast. Perfect for immersion.", image: "vue-storefront/public/assets/ultrawide-monitor-fallback.png", rating: 4.9, specs: ["QD‑OLED Panel", "3440x1440", "240Hz Refresh", "0.03ms Response"] },
            { id: "cyberpro-keyboard", name: "Cyber-Pro Mechanical Keyboard", price: 129, category: "peripherals", description: "Hot‑swappable brown switches, RGB, aluminum frame.", image: "assets/cyberpro-keyboard-fallback.png", rating: 4.5, specs: ["Tactile Brown Switches", "Aerospace Aluminum", "USB-C / 2.4GHz", "RGB per‑key"] },
            { id: "gaming-mouse", name: "Precision Gaming Mouse", price: 79.99, category: "peripherals", description: "16K DPI, 6 programmable buttons, lightweight.", image: "assets/gamingmouse.jpg", rating: 4.6, specs: ["16,000 DPI", "6 Buttons", "69g Weight", "RGB Lighting"] },
            { id: "wireless-headset", name: "Wireless ANC Headset", price: 149.99, category: "peripherals", description: "Low-latency 2.4GHz + Bluetooth 5.3, 40h battery.", image: "assets/headset.jpg", rating: 4.7, specs: ["Active Noise Cancelling", "40h Battery", "Low-latency Wireless", "Retractable Mic"] },
            { id: "usb-hub", name: "Powered USB-C Hub (7‑Port)", price: 59.99, category: "peripherals", description: "10Gbps transfer, 60W PD pass-through.", image: "assets/USBhub.jpg", rating: 4.4, specs: ["7 x USB 3.2", "60W Power Delivery", "10Gbps Speed", "Individual Switches"] }
        ];

        // ---------- Cart with quantities ----------
        let cart = [];

        function getCart() { return JSON.parse(localStorage.getItem('techstore_cart') || '[]'); }
        function saveCart() { localStorage.setItem('techstore_cart', JSON.stringify(cart)); updateCartUI(); }

        function addToCart(productId, productName, productPrice, quantity) {
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += quantity;
            } else {
                cart.push({ id: productId, name: productName, price: productPrice, quantity });
            }
            saveCart();
            showToast(`Added ${quantity} × ${productName} to cart`);
        }

        function updateQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
                saveCart();
            }
        }

        function removeItem(productId) {
            cart = cart.filter(i => i.id !== productId);
            saveCart();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-count-badge');
            const list = document.getElementById('cart-items-list');
            const totalSpan = document.getElementById('cart-total-display');
            if (badge) badge.textContent = cart.reduce((sum, i) => sum + i.quantity, 0);
            if (list) {
                list.innerHTML = '';
                let total = 0;
                cart.forEach(item => {
                    total += item.price * item.quantity;
                    const li = document.createElement('li');
                    li.className = 'flex flex-col gap-1 border-b border-slate-700 pb-2 mb-2';
                    li.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-medium">${item.name}</span>
                            <span class="text-cyan-400 text-sm">$${(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <button data-id="${item.id}" data-delta="-1" class="qty-btn bg-slate-700 px-2 rounded text-xs">-</button>
                                <span class="text-xs">${item.quantity}</span>
                                <button data-id="${item.id}" data-delta="1" class="qty-btn bg-slate-700 px-2 rounded text-xs">+</button>
                            </div>
                            <button data-id="${item.id}" class="remove-btn text-red-400 text-xs">Remove</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
                if (totalSpan) totalSpan.textContent = `$${total.toFixed(2)}`;
                document.querySelectorAll('.qty-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        updateQuantity(btn.dataset.id, parseInt(btn.dataset.delta));
                    });
                });
                document.querySelectorAll('.remove-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        removeItem(btn.dataset.id);
                    });
                });
            }
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast bg-cyan-800 text-white px-4 py-2 rounded-md shadow-lg text-sm';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // ---------- Render products with expandable cards ----------
        let currentFilter = 'all';
        let currentSort = 'default';
        let currentSearch = '';

        function renderProducts() {
            let filtered = products.filter(p => {
                if (currentFilter !== 'all' && p.category !== currentFilter) return false;
                if (currentSearch && !p.name.toLowerCase().includes(currentSearch.toLowerCase())) return false;
                return true;
            });
            if (currentSort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
            else if (currentSort === 'price-desc') filtered.sort((a,b) => b.price - a.price);
            else if (currentSort === 'name-asc') filtered.sort((a,b) => a.name.localeCompare(b.name));
            const container = document.getElementById('products-grid');
            if (!container) return;
            container.innerHTML = filtered.map(p => `
                <div class="product-card bg-slate-900 rounded-xl overflow-hidden border border-slate-800 transition-all duration-300">
                    <div class="relative">
                        <div class="h-48 w-full bg-slate-800 overflow-hidden">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                        </div>
                    </div>
                    <div class="p-5">
                        <div class="flex justify-between items-start">
                            <h3 class="text-lg font-bold text-white">${p.name}</h3>
                            <div class="star-rating text-yellow-400 text-sm">${'★'.repeat(Math.floor(p.rating))}${'☆'.repeat(5-Math.floor(p.rating))}</div>
                        </div>
                        <p class="text-slate-400 text-sm mt-1">${p.description}</p>
                        <div class="mt-3 text-2xl font-bold text-cyan-400">$${p.price.toFixed(2)}</div>

                        <!-- Extra content that appears on hover -->
                        <div class="extra-content mt-3 space-y-3">
                            <div class="border-t border-slate-700 pt-2">
                                <p class="text-xs text-slate-400 font-semibold mb-1">Technical specs:</p>
                                <ul class="text-xs text-slate-300 list-disc list-inside space-y-0.5">
                                    ${p.specs.map(s => `<li>${s}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2">
                                    <button data-id="${p.id}" class="qty-decr bg-slate-700 px-2 py-1 rounded text-sm">-</button>
                                    <span id="qty-${p.id}" class="qty-value text-sm w-6 text-center">1</span>
                                    <button data-id="${p.id}" class="qty-incr bg-slate-700 px-2 py-1 rounded text-sm">+</button>
                                </div>
                                <button data-id="${p.id}" data-name="${p.name.replace(/"/g, '&quot;')}" data-price="${p.price}" class="add-cart-detail bg-cyan-600 text-white px-3 py-1 rounded-md text-sm font-semibold hover:bg-cyan-500">Add to Cart</button>
                                <a href="product-detail.html?id=${p.id}" class="text-cyan-400 text-sm hover:underline">Details →</a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Attach per-card quantity increment/decrement and add-to-cart logic
            document.querySelectorAll('.qty-incr').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const span = document.getElementById(`qty-${id}`);
                    let val = parseInt(span.textContent);
                    val++;
                    span.textContent = val;
                });
            });
            document.querySelectorAll('.qty-decr').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const span = document.getElementById(`qty-${id}`);
                    let val = parseInt(span.textContent);
                    if (val > 1) val--;
                    span.textContent = val;
                });
            });
            document.querySelectorAll('.add-cart-detail').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const name = btn.dataset.name;
                    const price = parseFloat(btn.dataset.price);
                    const qtySpan = document.getElementById(`qty-${id}`);
                    const quantity = qtySpan ? parseInt(qtySpan.textContent) : 1;
                    addToCart(id, name, price, quantity);
                    // Reset quantity to 1 after adding
                    if (qtySpan) qtySpan.textContent = '1';
                    // Provide visual feedback on button
                    const originalText = btn.textContent;
                    btn.textContent = 'Added!';
                    setTimeout(() => btn.textContent = originalText, 800);
                });
            });
        }

        // Event listeners for filters, search, sort
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'bg-cyan-600', 'text-white'));
                btn.classList.add('active', 'bg-cyan-600', 'text-white');
                btn.classList.remove('bg-slate-800');
                currentFilter = btn.dataset.filter;
                renderProducts();
            });
        });
        document.getElementById('search-input')?.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderProducts();
        });
        document.getElementById('sort-select')?.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderProducts();
        });

        // Cart dropdown toggle (ensure IDs match your header)
        const cartTrigger = document.getElementById('cart-trigger');
        const cartDropdown = document.getElementById('cart-dropdown');
        if(cartTrigger && cartDropdown) {
            cartTrigger.addEventListener('click', (e) => { e.stopPropagation(); cartDropdown.classList.toggle('hidden'); });
            document.addEventListener('click', (e) => { if(!cartTrigger.contains(e.target) && !cartDropdown.contains(e.target)) cartDropdown.classList.add('hidden'); });
        }
        const checkoutBtn = document.getElementById('checkout-btn');
        if(checkoutBtn) checkoutBtn.addEventListener('click', () => window.location.href = 'checkout.html');

        // Load cart and render initial products
        cart = getCart();
        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
