<!DOCTYPE html>
<html lang="en">
<body style="font-family: Arial, sans-serif; background: #f4f6f8; padding: 24px;">
  <table align="center" width="600" style="background: #ffffff; border-radius: 8px; overflow: hidden;">
    <tr>
      <td style="background: #0891b2; padding: 24px; text-align: center;">
        <h1 style="color: #ffffff; margin: 0; font-size: 22px;">TechStore</h1>
      </td>
    </tr>
    <tr>
      <td style="padding: 32px 24px;">
        <h2 style="margin: 0 0 16px;">Thank you for reaching out, {{ message.name }}.</h2>
        <p style="color: #475569; line-height: 1.6; margin: 0 0 24px;">
          We have received your message and will get back to you within 24 hours.
        </p>
        <div style="background: #f8fafc; border-left: 4px solid #0891b2; padding: 16px; margin-bottom: 24px;">
          <p style="margin: 0 0 4px; font-size: 12px; color: #94a3b8;">YOUR MESSAGE</p>
          <p style="margin: 0; color: #334155;">{{ message.message }}</p>
        </div>
        <p style="color: #94a3b8; font-size: 13px;">
          This is an automated response — please do not reply directly to this email.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
