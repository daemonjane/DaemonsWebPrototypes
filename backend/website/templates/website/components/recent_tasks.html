<div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-white flex items-center gap-2">
      <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
      </svg>
      Recent Tasks
    </h2>
    <span class="text-xs text-slate-500">{{ tasks|length }} tasks</span>
  </div>

  <div class="space-y-3">
    {% for task in tasks %}
    <div class="flex items-start gap-3 p-3 rounded-lg {% if task.completed %}bg-emerald-950/20 border border-emerald-900/30{% else %}bg-slate-800/50 border border-slate-700/50{% endif %}">
      <span class="mt-0.5 flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center text-xs {% if task.completed %}bg-emerald-500 text-black{% else %}bg-slate-700 text-slate-400{% endif %}">
        {% if task.completed %}&check;{% else %}{{ forloop.counter }}{% endif %}
      </span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium {% if task.completed %}text-emerald-300 line-through{% else %}text-slate-200{% endif %}">
          {{ task.title }}
        </p>
        {% if task.description %}
        <p class="text-xs text-slate-500 mt-0.5">{{ task.description }}</p>
        {% endif %}
      </div>
      <span class="text-[10px] text-slate-600 flex-shrink-0">{{ task.created_at|date:"M j" }}</span>
    </div>
    {% empty %}
    <p class="text-slate-500 text-sm text-center py-8">No tasks yet.</p>
    {% endfor %}
  </div>
</div>
