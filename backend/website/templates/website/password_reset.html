{% extends "website/base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <h1 class="text-3xl font-bold text-white mb-6">Reset Password</h1>
  <form method="post" class="bg-slate-800/50 border border-slate-700 rounded-xl p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="text-slate-400 text-sm block mb-1">Email</label>
      {{ form.email }}
    </div>
    {% if form.errors %}
      <p class="text-red-400 text-sm">{{ form.errors.email.0 }}</p>
    {% endif %}
    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2 px-6 rounded-lg transition-colors w-full">Send Reset Link</button>
  </form>
</div>
{% endblock %}
