{% extends "website/base.html" %}

{% block title %}Message Sent{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto text-center py-16">
  <div class="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
  </div>
  <h1 class="text-3xl font-extrabold text-white">Thank You!</h1>
  <p class="text-slate-400 mt-4">Your message has been sent. We will get back to you within 24 hours.</p>
  <a href="/" class="inline-block mt-8 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 px-8 rounded-lg transition-colors">
    Back to Home
  </a>
</div>
{% endblock %}
