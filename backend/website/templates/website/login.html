{% extends "website/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-slate-900 border border-slate-800 rounded-xl p-8">
    <h1 class="text-2xl font-extrabold text-white text-center mb-8">Sign In</h1>

    <form method="POST">
      {% csrf_token %}

      {% if form.non_field_errors %}
      <div class="mb-4 p-3 rounded-lg bg-pink-950/30 border border-pink-700/50">
        <p class="text-pink-300 text-sm">{{ form.non_field_errors.0 }}</p>
      </div>
      {% endif %}

      <div class="space-y-5">
        <div class="field-group">
          <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-slate-300 mb-1.5">Username</label>
          <input type="text" name="username" id="{{ form.username.id_for_label }}" class="w-full bg-slate-800 border border-slate-700 rounded-md px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="Username" autofocus required>
        </div>

        <div class="field-group">
          <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
          <input type="password" name="password" id="{{ form.password.id_for_label }}" class="w-full bg-slate-800 border border-slate-700 rounded-md px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="Password" required>
        </div>

        <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2.5 px-6 rounded-lg transition-colors cursor-pointer">Sign In</button>
      </div>
    </form>

    <p class="text-center text-xs text-slate-500 mt-6">
      Need an account?
      <a href="{% url 'register' %}" class="text-cyan-400 hover:text-cyan-300">Register</a>
    </p>
  </div>
</div>
{% endblock %}
