{% extends "website/base.html" %}

{% block title %}Session Expired{% endblock %}

{% block content %}
<div class="text-center py-20 max-w-lg mx-auto px-4">
  <span class="text-7xl font-extrabold text-amber-400 tracking-tight block">CSRF</span>
  <svg class="w-16 h-16 mx-auto mt-4 text-slate-600" width="64" height="64" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20l1.9-1.9A7.9 7.9 0 0111 15h2a7.9 7.9 0 016.1 3.1L21 20"/></svg>
  <p class="text-slate-400 mt-4 text-lg">Session verification failed.</p>
  <p class="text-slate-600 text-sm mt-2">Your session may have expired. Please go back, refresh, and try again.</p>
  <div class="flex items-center justify-center gap-3 mt-8">
    <a href="/" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 px-8 rounded-lg transition-colors inline-flex items-center gap-2">
      <svg class="w-4 h-4" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Back to Home
    </a>
  </div>
</div>
{% endblock %}
