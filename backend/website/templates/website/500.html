{% extends "website/base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="text-center py-20 max-w-lg mx-auto px-4" role="alert" aria-live="polite">
  <span class="text-7xl font-extrabold text-pink-400 tracking-tight block">500</span>
  <svg class="w-16 h-16 mx-auto mt-4 text-slate-600" width="64" height="64" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
  <p class="text-slate-400 mt-4 text-lg">Something went wrong on our end.</p>
  <p class="text-slate-600 text-sm mt-2">The server encountered an internal error. Please try again later.</p>
  <div class="flex items-center justify-center gap-3 mt-8">
    <a href="/" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 px-8 rounded-lg transition-colors inline-flex items-center gap-2" aria-label="Return to homepage">
      <svg class="w-4 h-4" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Back to Home
    </a>
  </div>
</div>
{% endblock %}
